<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Cache Control Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">


    <title>PSD Outfit Manager</title>
    <!-- ag-psd library for parsing and writing PSD files -->
    <script src="https://cdn.jsdelivr.net/npm/ag-psd@2.1.0/dist/bundle.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #1e1e1e; color: #ccc; }
        
        /* Main Layout */
        #workspace { display: flex; flex: 1; overflow: hidden; position: relative; }
        .panel { display: flex; flex-direction: column; background: #252526; border-right: 1px solid #333; padding: 10px; transition: all 0.2s ease-in-out; }
        
        #left-panel { width: 300px; position: relative; }
        #left-panel.collapsed { width: 0; padding: 0; overflow: hidden; border-right: none; }

        #center-panel { flex: 1; background: #141414; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: auto; position: relative; }
        #right-panel { width: 360px; border-right: none; }

        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        h3 { font-size: 14px; text-transform: uppercase; color: #888; margin: 0; }

        /* Collapse Toggle Button */
        #btn-toggle-dir { background: #333; color: #ccc; border: 1px solid #444; border-radius: 3px; cursor: pointer; padding: 2px 6px; font-size: 11px; }
        #btn-toggle-dir:hover { background: #444; color: #fff; }
        #btn-show-dir { position: absolute; top: 10px; left: 10px; z-index: 10; display: none; background: #252526; color: #ccc; border: 1px solid #444; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        #btn-show-dir:hover { background: #333; color: #fff; }

        /* File Directory / Tree View */
        #tree-view { flex: 1; overflow-y: auto; background: #1e1e1e; border: 1px solid #333; padding: 5px; border-radius: 4px; }
        .tree-item { padding: 4px 8px; cursor: pointer; user-select: none; display: flex; align-items: center; font-size: 13px; margin: 1px 0; border-radius: 3px; }
        .tree-item:hover { background: #2a2d2e; }
        .tree-item.selected { background: #094771 !important; color: #fff; }
        .tree-item .type-icon { margin-right: 6px; font-size: 11px; opacity: 0.7; }
        .tree-indent { display: inline-block; width: 14px; }

        /* Preview Canvas */
        #canvas-container { max-width: 90%; max-height: 90%; display: flex; align-items: center; justify-content: center; }
        canvas { max-width: 100%; max-height: 100%; border: 1px dashed #444; background-image: linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(-45deg, transparent 75%, #222 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; }

        /* Clothing Types List */
        #clothing-controls { margin-bottom: 10px; display: flex; gap: 5px; }
        #clothing-list { flex: 1; overflow-y: auto; background: #1e1e1e; border: 1px solid #333; padding: 5px; border-radius: 4px; }
        
        .clothing-folder { margin-bottom: 4px; }
        .folder-header { display: flex; align-items: center; background: #333; padding: 5px 8px; border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer; gap: 6px; user-select: none; }
        .folder-header:hover { background: #3c3c3c; }
        .folder-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .folder-content { padding-left: 14px; margin-top: 4px; display: flex; flex-direction: column; gap: 4px; }
        .folder-content.collapsed { display: none; }

        .clothing-item { display: flex; align-items: center; background: #2d2d2d; padding: 6px 8px; border-radius: 4px; gap: 8px; font-size: 13px; }
        .clothing-item input[type="checkbox"] { cursor: pointer; }
        
        /* Ibis Paint Style Layer Thumbnail */
        .item-thumbnail { width: 32px; height: 32px; min-width: 32px; border-radius: 3px; border: 1px solid #444; background-image: linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(-45deg, transparent 75%, #222 75%); background-size: 8px 8px; background-position: 0 0, 0 4px, 4px -4px, -4px 0px; object-fit: contain; }

        .clothing-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .clothing-item.editing { border: 1px solid #007acc; background: #1f3242; }
        
        .icon-btn { background: none; border: none; color: #aaa; cursor: pointer; padding: 2px 4px; font-size: 12px; border-radius: 2px; }
        .icon-btn:hover { color: #fff; background: #444; }

        /* Footer Toolbar */
        #toolbar { height: 50px; background: #2d2d2d; border-top: 1px solid #333; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; }
        .btn-group { display: flex; gap: 10px; }
        button.action-btn { background: #0e639c; color: white; border: none; padding: 6px 12px; font-size: 12px; cursor: pointer; border-radius: 2px; }
        button.action-btn:hover { background: #1177bb; }
        button.action-btn.secondary { background: #3c3c3c; }
        button.action-btn.secondary:hover { background: #4c4c4c; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div id="workspace">
        <!-- Overlay Button to restore Directory -->
        <button id="btn-show-dir" onclick="toggleDirectory(true)">► Layers Directory</button>

        <!-- Left Panel: Directory -->
        <div class="panel" id="left-panel">
            <div class="panel-header">
                <h3>Layers Directory</h3>
                <button id="btn-toggle-dir" onclick="toggleDirectory(false)">◄ Hide</button>
            </div>
            <div id="tree-view">Import a PSD file to view layers...</div>
        </div>

        <!-- Center Panel: Preview -->
        <div class="panel" id="center-panel">
            <div id="canvas-container">
                <canvas id="preview-canvas"></canvas>
            </div>
        </div>

        <!-- Right Panel: Clothing Types -->
        <div class="panel" id="right-panel">
            <div class="panel-header">
                <h3>Clothing Types</h3>
            </div>
            <div id="clothing-controls">
                <button class="action-btn" id="btn-add-clothing" style="flex:2;" disabled>+ Piece</button>
                <button class="action-btn secondary" id="btn-add-folder" style="flex:1;" disabled>+ Folder</button>
            </div>
            <div id="clothing-list"></div>
        </div>
    </div>

    <!-- Bottom Toolbar -->
    <div id="toolbar">
        <div class="btn-group">
            <button class="action-btn" onclick="document.getElementById('file-psd').click()">Import PSD</button>
            <button class="action-btn secondary" onclick="document.getElementById('file-data').click()">Import Clothing Data</button>
            <input type="file" id="file-psd" accept=".psd" onchange="loadPSD(this.files[0])">
            <input type="file" id="file-data" accept=".json" onchange="loadClothingData(this.files[0])">
        </div>
        <div class="btn-group">
            <button class="action-btn secondary" id="btn-save-data" onclick="saveClothingData()">Save Clothing Data</button>
            <button class="action-btn" id="btn-export-psd" onclick="exportPSD()">Export PSD</button>
        </div>
    </div>

<script>
    // Global State
    let psdFile = null;
    let psdTree = null;
    let flatLayers = []; // Map of ID -> Layer
    let selectedLayerIds = new Set();
    
    // UI Directory State
    let isDirectoryVisible = true;

    // Clothing Tree
    let clothingTree = []; 
    let editingClothingId = null;
    let psdSignature = "";
    
    // Hover Animation State
    let hoveredLayerId = null;
    let animFrameId = null;

    // Offscreen Canvas for Tinting
    const tintCanvas = document.createElement('canvas');
    const tintCtx = tintCanvas.getContext('2d');

    // DOM Elements
    const treeView = document.getElementById('tree-view');
    const canvas = document.getElementById('preview-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const clothingListEl = document.getElementById('clothing-list');
    const btnAddClothing = document.getElementById('btn-add-clothing');
    const btnAddFolder = document.getElementById('btn-add-folder');
    const leftPanel = document.getElementById('left-panel');
    const btnShowDir = document.getElementById('btn-show-dir');

    // --- DIRECTORY TOGGLE FUNCTION ---
    function toggleDirectory(show) {
        isDirectoryVisible = show;
        if (show) {
            leftPanel.classList.remove('collapsed');
            btnShowDir.style.display = 'none';
        } else {
            leftPanel.classList.add('collapsed');
            btnShowDir.style.display = 'block';
        }
        renderClothingList();
    }

    // --- 1. PSD IMPORT & PARSING (NORMALIZED CANVASES) ---
    async function loadPSD(file) {
        if (!file) return;
        psdFile = file;
        psdSignature = `${file.name}_${file.size}`;
        
        const buffer = await file.arrayBuffer();
        
        psdTree = agPsd.readPsd(buffer, {
            skipImageData: false,
            useCanvas: true,
            skipThumbnail: true
        });
        
        canvas.width = psdTree.width;
        canvas.height = psdTree.height;
        tintCanvas.width = psdTree.width;
        tintCanvas.height = psdTree.height;

        flatLayers = [];
        selectedLayerIds.clear();
        let idCounter = 0;

        function normalizeNode(node) {
            node._id = "layer_" + (idCounter++);
            
            if (node.canvas) {
                const fullCanvas = document.createElement('canvas');
                fullCanvas.width = psdTree.width;
                fullCanvas.height = psdTree.height;
                const fCtx = fullCanvas.getContext('2d', { willReadFrequently: true });

                fCtx.drawImage(node.canvas, node.left || 0, node.top || 0);

                node.canvas = fullCanvas;
                node.left = 0;
                node.top = 0;
            }

            flatLayers.push(node);

            if (node.children) {
                node.children.forEach(normalizeNode);
            }
        }

        normalizeNode(psdTree);

        renderDirectory();
        updatePreview();
        btnAddClothing.disabled = false;
        btnAddFolder.disabled = false;
    }

    // --- 2. DIRECTORY / TREE VIEW ---
    function renderDirectory() {
        treeView.innerHTML = '';
        
        function buildDOM(node, depth = 0) {
            if (node === psdTree) {
                if (node.children) node.children.forEach(c => buildDOM(c, depth));
                return;
            }

            const item = document.createElement('div');
            item.className = 'tree-item' + (selectedLayerIds.has(node._id) ? ' selected' : '');
            item.dataset.id = node._id;

            let indent = '<span class="tree-indent"></span>'.repeat(depth);
            let icon = node.children ? '📁' : '🖼️';
            item.innerHTML = `${indent}<span class="type-icon">${icon}</span>${node.name || 'Unnamed Layer'}`;

            item.addEventListener('click', (e) => handleLayerClick(e, node._id));

            item.addEventListener('mouseenter', () => {
                hoveredLayerId = node._id;
                updatePreview();
            });
            item.addEventListener('mouseleave', () => {
                if (hoveredLayerId === node._id) {
                    hoveredLayerId = null;
                    updatePreview();
                }
            });

            treeView.appendChild(item);

            if (node.children) {
                node.children.forEach(c => buildDOM(c, depth + 1));
            }
        }

        buildDOM(psdTree);
    }

    function handleLayerClick(e, id) {
        if (e.ctrlKey || e.metaKey || e.shiftKey) {
            if (selectedLayerIds.has(id)) selectedLayerIds.delete(id);
            else selectedLayerIds.add(id);
        } else {
            selectedLayerIds.clear();
            selectedLayerIds.add(id);
        }
        renderDirectory();
    }

    // --- 3. CANVAS PREVIEW RENDERER ---
    function updatePreview() {
        if (animFrameId) {
            cancelAnimationFrame(animFrameId);
            animFrameId = null;
        }

        if (!psdTree) return;

        const pulseOpacity = hoveredLayerId 
            ? 0.65 + 0.35 * Math.sin(Date.now() / 180) 
            : 1.0;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const hoveredCanvases = [];

        function findNodeById(node, targetId) {
            if (!node || !targetId) return null;
            if (node._id === targetId) return node;
            if (node.children) {
                for (let child of node.children) {
                    const found = findNodeById(child, targetId);
                    if (found) return found;
                }
            }
            return null;
        }

        function collectCanvases(node) {
            if (!node) return;
            if (node.canvas) {
                hoveredCanvases.push(node.canvas);
            }
            if (node.children) {
                node.children.forEach(collectCanvases);
            }
        }

        function drawNode(node) {
            if (node.hidden) return;
            
            if (node.canvas) {
                ctx.drawImage(node.canvas, 0, 0);
            }

            if (node.children) {
                node.children.forEach(drawNode);
            }
        }

        drawNode(psdTree);

        if (hoveredLayerId) {
            const targetNode = findNodeById(psdTree, hoveredLayerId);
            if (targetNode) {
                collectCanvases(targetNode);
            }

            if (hoveredCanvases.length > 0) {
                tintCtx.clearRect(0, 0, tintCanvas.width, tintCanvas.height);
                hoveredCanvases.forEach(c => tintCtx.drawImage(c, 0, 0));

                ctx.save();
                ctx.globalAlpha = pulseOpacity;

                ctx.shadowColor = '#00e5ff';
                ctx.shadowBlur = 12;
                ctx.drawImage(tintCanvas, 0, 0);
                ctx.shadowBlur = 0;

                ctx.drawImage(tintCanvas, 0, 0);
                ctx.restore();

                animFrameId = requestAnimationFrame(updatePreview);
            }
        }
    }
    
    // --- 4. THUMBNAIL GENERATOR ---
    function generateItemThumbnail(layerIds) {
        if (!psdTree || !layerIds || layerIds.length === 0) return null;

        const offscreen = document.createElement('canvas');
        offscreen.width = psdTree.width;
        offscreen.height = psdTree.height;
        const oCtx = offscreen.getContext('2d');

        function drawLayerRecursive(node) {
            if (!node) return;
            if (layerIds.includes(node._id) && node.canvas) {
                oCtx.drawImage(node.canvas, 0, 0);
            }
            if (node.children) {
                node.children.forEach(drawLayerRecursive);
            }
        }

        drawLayerRecursive(psdTree);
        return offscreen.toDataURL();
    }

    // --- 5. CLOTHING TYPES MANAGEMENT ---
    btnAddFolder.addEventListener('click', () => {
        const title = prompt("Enter folder name:", "Outfits");
        if (!title) return;

        clothingTree.push({
            id: "folder_" + Date.now(),
            type: 'folder',
            title: title,
            collapsed: false,
            items: []
        });

        renderClothingList();
    });

    btnAddClothing.addEventListener('click', () => {
        if (selectedLayerIds.size === 0) {
            alert("Please select at least one folder or layer from the directory first.");
            return;
        }

        if (editingClothingId) {
            const item = findClothingItem(editingClothingId);
            if (item) {
                item.layerIds = Array.from(selectedLayerIds);
            }
            editingClothingId = null;
            btnAddClothing.innerText = "+ Piece";
        } else {
            const title = prompt("Enter clothing piece title:", "Shirt #1");
            if (!title) return;

            const newItem = {
                id: "clothing_" + Date.now(),
                type: 'item',
                title: title,
                visible: true,
                layerIds: Array.from(selectedLayerIds)
            };

            clothingTree.push(newItem);
        }

        selectedLayerIds.clear();
        renderDirectory();
        renderClothingList();
        syncLayersFromClothing(); // Updated to ensure state sync
    });

    function findClothingItem(id, list = clothingTree) {
        for (let node of list) {
            if (node.id === id) return node;
            if (node.type === 'folder' && node.items) {
                const found = findClothingItem(id, node.items);
                if (found) return found;
            }
        }
        return null;
    }

    function getAllClothingItems(list = clothingTree) {
        let results = [];
        for (let node of list) {
            if (node.type === 'item') {
                results.push(node);
            } else if (node.type === 'folder' && node.items) {
                results = results.concat(getAllClothingItems(node.items));
            }
        }
        return results;
    }

    function renderClothingList() {
        clothingListEl.innerHTML = '';

        function buildItemDOM(item, parentContainer) {
            const el = document.createElement('div');
            el.className = 'clothing-item' + (editingClothingId === item.id ? ' editing' : '');

            const thumbUrl = generateItemThumbnail(item.layerIds);
            const thumbImg = thumbUrl ? `<img class="item-thumbnail" src="${thumbUrl}" alt="preview" />` : '';

            const editBtnHTML = isDirectoryVisible 
                ? `<button class="icon-btn" onclick="editClothing('${item.id}')" title="Edit Layer Selection">✏️</button>` 
                : '';

            el.innerHTML = `
                <input type="checkbox" ${item.visible ? 'checked' : ''} onchange="toggleClothingCheck('${item.id}', this.checked)">
                ${thumbImg}
                <span class="clothing-title" title="${item.title}">${item.title}</span>
                <button class="icon-btn" onclick="toggleClothingVisibility('${item.id}')" title="Toggle Visibility">${item.visible ? '👁️' : '🙈'}</button>
                ${editBtnHTML}
                <button class="icon-btn" onclick="moveClothingItem('${item.id}')" title="Move to Folder">📁</button>
                <button class="icon-btn" onclick="deleteClothing('${item.id}')" title="Delete Piece">🗑️</button>
            `;
            parentContainer.appendChild(el);
        }

        function buildFolderDOM(folder) {
            const folderEl = document.createElement('div');
            folderEl.className = 'clothing-folder';

            const header = document.createElement('div');
            header.className = 'folder-header';
            header.innerHTML = `
                <span>${folder.collapsed ? '📁' : '📂'}</span>
                <span class="folder-title">${folder.title}</span>
                <button class="icon-btn" onclick="renameFolder('${folder.id}', event)" title="Rename Folder">✏️</button>
                <button class="icon-btn" onclick="deleteFolder('${folder.id}', event)" title="Delete Folder">🗑️</button>
            `;

            header.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON') return;
                folder.collapsed = !folder.collapsed;
                renderClothingList();
            });

            const content = document.createElement('div');
            content.className = 'folder-content' + (folder.collapsed ? ' collapsed' : '');

            folder.items.forEach(child => buildItemDOM(child, content));

            folderEl.appendChild(header);
            folderEl.appendChild(content);
            clothingListEl.appendChild(folderEl);
        }

        clothingTree.forEach(node => {
            if (node.type === 'folder') {
                buildFolderDOM(node);
            } else {
                buildItemDOM(node, clothingListEl);
            }
        });
    }

    function moveClothingItem(itemId) {
        const folders = clothingTree.filter(n => n.type === 'folder');
        
        let targetFolderName = prompt(
            `Move piece to folder:\nAvailable folders: [Root, ${folders.map(f => f.title).join(', ')}]\n\nType folder name or 'Root':`
        );

        if (!targetFolderName) return;
        targetFolderName = targetFolderName.trim();

        let targetItem = null;

        function removeFromList(list) {
            for (let i = 0; i < list.length; i++) {
                if (list[i].id === itemId) {
                    targetItem = list.splice(i, 1)[0];
                    return true;
                }
                if (list[i].type === 'folder' && list[i].items) {
                    if (removeFromList(list[i].items)) return true;
                }
            }
            return false;
        }

        removeFromList(clothingTree);

        if (!targetItem) return;

        if (targetFolderName.toLowerCase() === 'root') {
            clothingTree.push(targetItem);
        } else {
            const destFolder = folders.find(f => f.title.toLowerCase() === targetFolderName.toLowerCase());
            if (destFolder) {
                destFolder.items.push(targetItem);
            } else {
                alert("Folder not found. Moved back to root.");
                clothingTree.push(targetItem);
            }
        }

        renderClothingList();
    }

    function renameFolder(folderId, e) {
        if (e) e.stopPropagation();
        const folder = clothingTree.find(n => n.id === folderId);
        if (!folder) return;

        const newName = prompt("Rename folder:", folder.title);
        if (newName) {
            folder.title = newName;
            renderClothingList();
        }
    }

    function deleteFolder(folderId, e) {
        if (e) e.stopPropagation();
        const index = clothingTree.findIndex(n => n.id === folderId);
        if (index !== -1) {
            const folder = clothingTree[index];
            if (folder.items && folder.items.length > 0) {
                clothingTree.push(...folder.items);
            }
            clothingTree.splice(index, 1);
            renderClothingList();
            syncLayersFromClothing();
        }
    }

    // --- FIX FOR SHARED ASSET VISIBILITY OVERWRITING ---
    function syncLayersFromClothing() {
        const allItems = getAllClothingItems();
        
        // 1. Collect all layer IDs that belong to currently active/visible clothing pieces
        const activeLayerIds = new Set();
        allItems.forEach(item => {
            if (item.visible) {
                item.layerIds.forEach(lId => activeLayerIds.add(lId));
            }
        });

        // 2. Set visibility based on whether the layer ID is in the active set
        flatLayers.forEach(layer => {
            // Check if this layer is assigned to ANY clothing item
            const isManagedLayer = allItems.some(item => item.layerIds.includes(layer._id));
            if (isManagedLayer) {
                layer.hidden = !activeLayerIds.has(layer._id);
            }
        });

        updatePreview();
    }

    function toggleClothingCheck(id, checked) {
        const item = findClothingItem(id);
        if (item) {
            item.visible = checked;
            syncLayersFromClothing();
            renderClothingList();
        }
    }

    function toggleClothingVisibility(id) {
        const item = findClothingItem(id);
        if (item) {
            item.visible = !item.visible;
            syncLayersFromClothing();
            renderClothingList();
        }
    }

    function editClothing(id) {
        const item = findClothingItem(id);
        if (!item) return;

        editingClothingId = id;
        selectedLayerIds = new Set(item.layerIds);
        btnAddClothing.innerText = "Update Piece";
        
        renderDirectory();
        renderClothingList();
    }

    function deleteClothing(id) {
        function remove(list) {
            for (let i = 0; i < list.length; i++) {
                if (list[i].id === id) {
                    list.splice(i, 1);
                    return true;
                }
                if (list[i].type === 'folder' && list[i].items) {
                    if (remove(list[i].items)) return true;
                }
            }
            return false;
        }

        remove(clothingTree);

        if (editingClothingId === id) {
            editingClothingId = null;
            btnAddClothing.innerText = "+ Piece";
        }
        renderClothingList();
        syncLayersFromClothing();
    }

    // --- 6. DATA IMPORT / EXPORT & PROTECTION ---
    function saveClothingData() {
        if (!psdFile) {
            alert("Please load a PSD file first.");
            return;
        }

        const exportData = {
            signature: psdSignature,
            psdName: psdFile.name,
            tree: clothingTree
        };

        const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${psdFile.name.replace('.psd', '')}_clothing_data.json`;
        a.click();
    }

    async function loadClothingData(file) {
        if (!file) return;

        const text = await file.text();
        try {
            const data = JSON.parse(text);

            if (psdFile && data.signature !== psdSignature) {
                const proceed = confirm(
                    `⚠️ COMPATIBILITY WARNING!\n\nThis clothing data file was created for "${data.psdName || 'a different PSD'}".\n\nIt may not line up correctly with your currently open PSD.\nDo you still want to load it?`
                );
                if (!proceed) return;
            }

            clothingTree = data.tree || data.items || [];
            renderClothingList();
            syncLayersFromClothing();
        } catch (err) {
            alert("Error parsing clothing data JSON file.");
        }
    }

    // --- 7. CLEAN PSD EXPORT ---
    function exportPSD() {
        if (!psdTree) {
            alert("No active PSD to export!");
            return;
        }

        syncLayersFromClothing();

        function clonePsdTree(node) {
            const clone = {
                name: node.name,
                visible: node.hidden === true ? false : true,
                hidden: node.hidden === true,
                left: 0,
                top: 0,
                opacity: node.opacity !== undefined ? node.opacity : 1,
                blendMode: node.blendMode || 'normal'
            };

            if (node.canvas) {
                clone.canvas = node.canvas;
            }

            if (node.children) {
                clone.children = node.children.map(clonePsdTree);
            }

            return clone;
        }

        const exportTree = clonePsdTree(psdTree);
        exportTree.width = psdTree.width;
        exportTree.height = psdTree.height;
        exportTree.canvas = canvas;

        try {
            const buffer = agPsd.writePsd(exportTree, {
                generateThumbnail: true,
                trim: false
            });
            
            const blob = new Blob([buffer], { type: 'image/vnd.adobe.photoshop' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `edited_${psdFile ? psdFile.name : 'project.psd'}`;
            a.click();
        } catch (err) {
            console.error("Export error:", err);
            alert("Failed to export PSD: " + err.message);
        }
    }
</script>
